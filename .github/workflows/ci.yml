name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify npm package
        working-directory: apps/cli
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/runnerduty-install" "$RUNNER_TEMP"/runnerduty-*.tgz
          "$RUNNER_TEMP/runnerduty-install/node_modules/.bin/runnerduty" --help
          cmp ../../skills/runnerduty/SKILL.md "$RUNNER_TEMP/runnerduty-install/node_modules/runnerduty/dist/SKILL.md"
