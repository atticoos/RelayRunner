name: RelayRunner dev

on:
  workflow_dispatch:

jobs:
  relay:
    uses: relayrunner/actions/.github/workflows/relay.yml@v1.0.0-beta.2
    with:
      github: ubuntu-latest

  test:
    needs: relay
    runs-on: ${{ needs.relay.outputs.runner }}
    steps:
      - name: Report route
        env:
          CHOSEN_RUNNER: ${{ needs.relay.outputs.runner }}
        run: |
          route="$CHOSEN_RUNNER"

          echo "Routed to: $route"
          echo "Runner name: $RUNNER_NAME"
          uname -a

          {
            echo "## RelayRunner route"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Chosen runner | \`$route\` |"
            echo "| Runner name | \`$RUNNER_NAME\` |"
            echo "| OS / arch | $RUNNER_OS / $RUNNER_ARCH |"
          } >> "$GITHUB_STEP_SUMMARY"
