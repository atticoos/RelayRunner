name: PR title

# Checks that the pull request title is a Conventional Commit. RelayRunner answers this job itself
# (a native check), so it uses no VM and no Actions minute.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: relayrunner
    steps:
      - uses: relayrunner/actions/checks/pr-title@v1.0.0-beta.3
