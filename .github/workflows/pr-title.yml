name: PR title

# Checks that the pull request title is a Conventional Commit. RelayRunner answers this job itself
# (a native check), so it uses no VM and no Actions minute.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: relayrunner
    steps:
      # The merge commit of relayrunner/actions#4. Move to @v1 once it's released.
      - uses: relayrunner/actions/checks/pr-title@b69840926b21ff58b9dbc990497ca5f9b3b20c3a
